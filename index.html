<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemoDay tusul ajil web xuudas</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color:whitesmoke;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
        }
        section {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }
        h2 {
            color:#2c3e50;
        }
        nav {
            background-color: #2c3e50;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color:#f2f2f2;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input, textarea {
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color:#2980b9;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Төсөлт ажлын танилцуулга</h1>
    </header>
    <section><h2>Нүүр хуудас</h2>
    <p>Энэ бол манай төсөлт ажлын танилцуулга юм. Бид IT хичээлийн хүрээнд видео бичлэг болон Word баримт бэлтгэж байна.</p>
    <p>Бичлэг:<a href="orulna">Мэдээллүүд яриагаар сонсох хэсэг</a></p>
    <p>Word мэдээлэл:<a href="orulnaaaa">Бичвэр мэдээллийн хэсэг</a></p>
    </section>
    <section>
        <h2>Холбоо барих санал хүсэл</h2>
        <form>
            <input type="text" name="name" placeholder="Таны нэр" required>
            <input type="email" name="email" placeholder="Таны имэйл" required>
            <textarea name="message" cols="30" rows="10" placeholder="Санал хүсэлтээ энд бичнэ үү" required></textarea>
            <input type="submit" value="ilgeex">
        </form>
    </section>
    <footer>
        <p>2025 төсөлт ажил</p>
    </footer>
</body>
</html>
